};
firebase.initializeApp(firebaseConfig);
var _db = firebase.firestore();
var _REF = _db.collection("famofi").doc("main");

window._fbSave = function(d) {
  return _REF.set({ payload: JSON.stringify(d) }).catch(function(e) {
    localStorage.setItem("fm_data", JSON.stringify(d));
  });
};
window._fbSubscribe = function(cb) {
  return _REF.onSnapshot(function(snap) {
    if (snap.exists) { try { cb(JSON.parse(snap.data().payload)); } catch(e) {} }
  }, function() {});
};
window._fbLoad = function() {
  return _REF.get().then(function(snap) {
    if (snap.exists) return JSON.parse(snap.data().payload);
    return null;
  }).catch(function() { return null; });
};
// Signal ready
window._fbReady = true;
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f8;--surface:#fff;--border:#dde2f0;--border2:#c5ccdf;
  --text:#1e2340;--text2:#5a6080;--text3:#9aa0b8;
  --accent:#4f6ef7;--accent2:#3a57e8;--accent-bg:#eef1fe;
  --teal:#0e9f6e;--teal-bg:#e0f7ee;
  --amber:#d97706;--amber-bg:#fef3c7;
  --red:#e3403a;--red-bg:#fde8e8;
  --coral:#e05c2a;--coral-bg:#fdeee7;
  --purple:#7c3aed;--purple-bg:#ede9fe;
  --blue:#1d83e2;--blue-bg:#e8f3fd;
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 2px 8px rgba(79,110,247,.08);
  --shadow-md:0 4px 20px rgba(79,110,247,.12);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;min-height:100vh}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;gap:10px;box-shadow:var(--shadow)}
.logo{font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.logo span{color:var(--text2);font-weight:400}
nav{display:flex;gap:2px}
nav button{background:none;border:none;padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;font-weight:500;transition:all .15s}
nav button:hover{background:var(--accent-bg);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff}
.hdr-right{display:flex;gap:8px;align-items:center}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);transition:background .3s}
.lang-btn{background:none;border:1.5px solid var(--border);padding:4px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);font-family:inherit}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
main{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.kpi-val{font-size:26px;font-weight:700;color:var(--text)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-title{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;height:160px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;transition:border .15s}
.search-wrap input:focus{border-color:var(--accent)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
select.filter{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;cursor:pointer;font-family:inherit}

.imp-ok{background:var(--teal-bg);color:var(--teal);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.imp-err{background:var(--red-bg);color:var(--red);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.drop-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.inv-field-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:7px}
.sh-form-row{display:grid;grid-template-columns:auto 1fr 72px 90px auto;gap:6px;align-items:center;margin-bottom:7px;padding:6px 8px;background:var(--bg);border-radius:var(--radius-xs);border:1px solid var(--border)}
.sh-form-row input,.sh-form-row select{padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;width:100%}
@media(max-width:700px){.kpi-grid{grid-template-columns:1fr 1fr}.charts-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>

var lang=localStorage.getItem('fm_lang')||'en';
function t(k){return T[lang][k]||k;}
function toggleLang(){lang=lang==='en'?'es':'en';localStorage.setItem('fm_lang',lang);document.getElementById('langBtn').textContent=lang==='en'?'ES':'EN';render();}

// ── Data ──────────────────────────────────────────────────────────────────────
var data={companies:[],investments:[]};
var _saveTimer=null;

function save(){
  setSyncDot('saving');
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){
    localStorage.setItem('fm_data',JSON.stringify(data));
    if(window._fbSave){
      window._fbSave(data).then(function(){setSyncDot('ok');}).catch(function(){setSyncDot('error');});
    } else { setSyncDot('ok'); }
  },500);
}
function setSyncDot(s){
  var d=document.getElementById('sync-dot');if(!d)return;
  if(s==='saving'){d.style.background='var(--amber)';d.title='Saving…';}
  else if(s==='error'){d.style.background='var(--red)';d.title='Sync error';}
  else{d.style.background='var(--teal)';d.title='Synced';}
}
function uid(){return '_'+Math.random().toString(36).slice(2,9);}
function cname(id){var c=data.companies.find(function(x){return x.id===id;});return c?c.name:id;}
function resolveOwner(sh){return sh.type==='company'?cname(sh.person):sh.person;}
function getSubs(pid){return data.companies.filter(function(c){return c.shareholders.some(function(s){return s.type==='company'&&s.person===pid;});});}
function getParents(cid){return data.companies.filter(function(p){return getSubs(p.id).some(function(s){return s.id===cid;});});}
function fmtD(n){return (n!=null&&n!=='') ? '$'+(+n).toLocaleString() : '—';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function q(id){return "'"+id+"'";}  // wraps an id in single quotes for onclick strings

function sBadge(s){
  if(s==='active') return '<span class="badge badge-active">'+t('active')+'</span>';
  if(s==='dormant') return '<span class="badge badge-dormant">'+t('dormant')+'</span>';
  return '<span class="badge badge-liquidation">'+t('liquidation')+'</span>';
}
function dr(label,val){
  if(!val&&val!==0) return '';
  return '<div class="dr"><div class="dr-lbl">'+label+'</div><div class="dr-val">'+val+'</div></div>';
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
function applyLoaded(d){
  data=d;
  if(!data.investments) data.investments=[];
  data.companies.forEach(function(c){
    c.shareholders.forEach(function(s){if(!s.type)s.type='individual';});
    if(!c.banking) c.banking=[];
    if(!c.custom) c.custom=[];
    if(!c.yearFounded&&c.year) c.yearFounded=String(c.year);
  });
  data.investments.forEach(function(inv){
    if(inv.commitment==null) inv.commitment=0;
    if(inv.calls==null) inv.calls=0;
    if(inv.distributions==null) inv.distributions=0;
    if(inv.marketValue==null) inv.marketValue=0;
    if(!inv.fund) inv.fund='';
    if(!inv.family) inv.family='';
    if(!inv.fields) inv.fields=[];
  });
}

function bootstrap(){
  var doStart=function(loaded){
    if(loaded){ applyLoaded(loaded); }
    else {
      var ls=localStorage.getItem('fm_data');
      if(ls){try{applyLoaded(JSON.parse(ls));}catch(e){seedData();save();}}
      else{seedData();save();}
    }
    if(window._fbSubscribe){
      window._fbSubscribe(function(remote){applyLoaded(remote);render();});
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    render();
  };

  // Try Firebase with a 5s timeout fallback
  var done=false;
  function finish(loaded){
    if(done) return;
    done=true;
    doStart(loaded);
  }

  setTimeout(function(){ finish(null); }, 5000); // fallback

  if(window._fbLoad){
    window._fbLoad().then(function(d){ finish(d); }).catch(function(){ finish(null); });
  } else {
    finish(null);
  }
}

// Start — works whether DOM is ready or not
if(document.readyState==='loading'){
  window.addEventListener('DOMContentLoaded',bootstrap);
} else {
  bootstrap();
}

// ── Router ────────────────────────────────────────────────────────────────────
var page='overview';
var pages=['overview','companies','shareholders','investments','network'];
function go(p){page=p;render();}

// ── Charts ────────────────────────────────────────────────────────────────────
var COLORS=['#4f6ef7','#0e9f6e','#f59e0b','#7c3aed','#e3403a','#1d83e2','#10b981','#f97316','#8b5cf6','#ef4444'];
var charts={};
function destroyCharts(){Object.values(charts).forEach(function(c){try{c.destroy();}catch(e){}});charts={};}
function mkChart(id,type,labels,values){
  var ctx=document.getElementById(id);if(!ctx)return;
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(ctx,{type:type,
    data:{labels:labels,datasets:[{data:values,backgroundColor:COLORS.slice(0,labels.length),borderWidth:0,borderRadius:type==='bar'?5:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:type!=='bar',position:'bottom',labels:{boxWidth:10,font:{size:10},padding:8}}},
      scales:type==='bar'?{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#eef0f8'},ticks:{font:{size:10},stepSize:1}}}:undefined
    }
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  var nav=document.getElementById('nav');
  nav.innerHTML='';
  pages.forEach(function(p){
    var b=document.createElement('button');
    b.textContent=t(p);
    b.className=p===page?'active':'';
    b.onclick=function(){go(p);};
    nav.appendChild(b);
  });
  destroyCharts();
  var m=document.getElementById('main');
  if(page==='overview')     {m.innerHTML=renderOverview();setTimeout(buildOvCharts,50);}
  else if(page==='companies')    {m.innerHTML=renderCompanies();}
  else if(page==='shareholders') {m.innerHTML=renderShareholders();}
  else if(page==='investments')  {m.innerHTML=renderInvestments();setTimeout(buildInvCharts,50);}
  else if(page==='network')      {m.innerHTML=renderNetwork();}
}
function renderPage(){
  var m=document.getElementById('main');
  destroyCharts();
  if(page==='companies')    {m.innerHTML=renderCompanies();}
  else if(page==='shareholders') {m.innerHTML=renderShareholders();}
  else if(page==='investments')  {m.innerHTML=renderInvestments();setTimeout(buildInvCharts,50);}
  else if(page==='network')      {m.innerHTML=renderNetwork();}
}

function renderBankView(id){
  var c=data.companies.find(function(x){return x.id===id;});if(!c)return '';
  if(!c.banking.length) return '<div class="empty">'+t('noData')+'</div>';
  var h='';
  c.banking.forEach(function(b,bi){
    h+='<div class="bank-row">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<div style="font-weight:700">'+esc(b.bank)+' <span style="color:var(--text3);font-weight:400;font-size:12px">'+esc(b.currency||'')+' '+esc(b.type||'')+'</span></div>';
    h+='<div style="display:flex;gap:5px">';
    h+='<button class="btn btn-outline btn-sm" onclick="editBankInModal('+q(id)+','+bi+')">'+t('editCompany')+'</button>';
    h+='<button class="btn btn-danger btn-sm" onclick="delBankAccount('+q(id)+','+bi+')">×</button>';
    h+='</div></div>';
    h+=dr(t('accountNo'),'<span class="bank-sensitive" onclick="this.classList.toggle(\'revealed\')">'+esc(b.account||'—')+'</span>');
    if(b.routing) h+=dr(t('routing'),'<span class="bank-sensitive" onclick="this.classList.toggle(\'revealed\')">'+esc(b.routing)+'</span>');

    h+='</div>';
  });
  return h;
}

function buildSHPie(id){
  var c=data.companies.find(function(x){return x.id===id;});if(!c||!c.shareholders.length)return;
  setTimeout(function(){
    mkChart('sh-pie','doughnut',c.shareholders.map(function(s){return resolveOwner(s);}),c.shareholders.map(function(s){return s.pct;}));
  },50);
}

function buildOrgChart(cid){
  var c=data.companies.find(function(x){return x.id===cid;});if(!c)return '';
  var parents=getParents(cid);
  var subs=getSubs(cid);
  var h='<div style="text-align:center">';
  h+='<div style="font-size:11px;color:var(--text2);margin-bottom:16px">';
  h+=lang==='en'?'Purple = parent · Blue = current · Green = subsidiaries':'Morado = matriz · Azul = actual · Verde = subsidiarias';
  h+='</div>';
  if(parents.length){
    h+='<div style="display:flex;justify-content:center;gap:10px;margin-bottom:0;flex-wrap:wrap">';
    parents.forEach(function(p){
      h+='<div onclick="closeModal();openCompany('+q(p.id)+')" class="org-card" style="border:2px solid var(--purple);background:var(--purple-bg)">';
      h+='<div class="org-card-name" style="color:var(--purple)">'+esc(p.name)+'</div>';
      h+='<div class="org-card-sub">'+esc(p.jurisdiction)+'</div></div>';
    });
    h+='</div>';
    h+='<div style="width:2px;height:24px;background:var(--border2);margin:0 auto"></div>';
  }
  h+='<div style="display:flex;justify-content:center">';
  h+='<div class="org-card" style="border:2.5px solid var(--accent);background:var(--accent-bg)">';
  h+='<div class="org-card-name" style="color:var(--accent)">'+esc(c.name)+'</div>';
  h+='<div class="org-card-sub">'+esc(c.jurisdiction)+'</div></div></div>';
  if(subs.length){
    h+='<div style="width:2px;height:24px;background:var(--border2);margin:0 auto"></div>';
    h+='<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">';
    subs.forEach(function(s){
      var sh=s.shareholders.find(function(sh){return sh.type==='company'&&sh.person===cid;});
      h+='<div style="display:flex;flex-direction:column;align-items:center">';
      h+='<div onclick="closeModal();openCompany('+q(s.id)+')" class="org-card" style="border:2px solid var(--teal);background:var(--teal-bg)">';
      h+='<div class="org-card-name" style="color:var(--teal)">'+esc(s.name)+'</div>';
      h+='<div class="org-card-sub">'+esc(s.jurisdiction)+(sh?' · '+sh.pct+'%':'')+'</div></div>';
      var sub2=getSubs(s.id);
      if(sub2.length) h+='<div style="font-size:10px;color:var(--teal);margin-top:4px">+'+sub2.length+' sub.</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function switchTab(btn,pid){
  var mb=btn.closest('.modal-body');
  mb.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  mb.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(pid).classList.add('active');
}

function renderNetwork(){
  var ownedIds=new Set();
  data.companies.forEach(function(c){c.shareholders.forEach(function(s){if(s.type==='company')ownedIds.add(s.person);});});
  var roots=data.companies.filter(function(c){return !ownedIds.has(c.id);});
  function treeNode(c,depth){
    var subs=getSubs(c.id);
    var indiv=c.shareholders.filter(function(s){return s.type==='individual';});
    var ic=data.investments.filter(function(i){return i.companyId===c.id;}).length;
    var col=depth===0?'var(--purple)':'var(--accent)';
    var bg=depth===0?'var(--purple-bg)':'var(--accent-bg)';
    var ml=depth*28;
    var h='<div style="margin-left:'+ml+'px;'+(depth?'border-left:2px dashed var(--border2);padding-left:14px;margin-top:4px':'')+'margin-bottom:4px">';
    h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1.5px solid '+col+';background:'+bg+';margin-bottom:4px" onclick="openCompany('+q(c.id)+')">';
    h+='<span>'+(depth===0?'🏢':'↳')+'</span>';
    h+='<span style="font-weight:700;color:'+col+'">'+esc(c.name)+'</span>';
    h+='<span class="badge badge-jur" style="font-size:10px">'+esc(c.jurisdiction)+'</span>';
    h+=sBadge(c.status);
    if(indiv.length) h+='<span style="font-size:11px;color:var(--text3)">'+indiv.map(function(s){return s.person+' '+s.pct+'%';}).join(', ')+'</span>';
    if(ic) h+='<span class="badge badge-inv" style="font-size:10px">'+ic+' inv.</span>';
    h+='</div>';
    subs.forEach(function(s){h+=treeNode(s,depth+1);});
    h+='</div>';
    return h;
  }
  var h='<div class="section-header"><div class="section-title">'+t('networkTitle')+'</div></div>';
  h+='<div class="card" style="margin-bottom:12px;padding:10px 16px;font-size:12px;color:var(--text2)">';
  h+=lang==='en'?'Purple = root companies. Subsidiaries are indented below. Click any row to open.':'Morado = empresas raíz. Subsidiarias indentadas. Clic para abrir.';
  h+='</div><div class="card">';
  if(roots.length){
    roots.forEach(function(c,i){
      h+=treeNode(c,0);
      if(i<roots.length-1) h+='<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">';
    });
  } else {
    h+='<div class="empty">'+t('noData')+'</div>';
  }
  h+='</div>';
  return h;
}

// ── Import ────────────────────────────────────────────────────────────────────
var _pending=[];
function openImport(){
  var h='<div class="modal-header"><div class="modal-title">'+t('importTitle')+'</div><button class="close-btn" onclick="closeModal()">×</button></div>';
  h+='<div class="modal-body"><div class="import-hint">'+(lang==='en'?'Supports .xlsx, .xls, .csv. Headers auto-detected. Shareholders: "Name 60%; Name2 40%"':'Soporta .xlsx, .xls, .csv. Encabezados detectados automáticamente.')+'</div>';
  h+='<div class="drop-zone" onclick="document.getElementById(\'fim\').click()" ondragover="event.preventDefault();this.style.borderColor=\'var(--accent)\'" ondragleave="this.style.borderColor=\'\'" ondrop="event.preventDefault();this.style.borderColor=\'\';handleDrop(event)">';
  h+='<div style="font-size:28px;margin-bottom:6px">📂</div>';
  h+='<div style="font-weight:600">'+(lang==='en'?'Click or drag & drop a file':'Clic o arrastra un archivo')+'</div>';
  h+='<div style="font-size:11px;color:var(--text3);margin-top:3px">.xlsx · .xls · .csv</div>';
  h+='<input id="fim" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileSelect(this)"></div>';
  h+='<div style="text-align:center;font-size:12px;color:var(--text3);margin-bottom:8px">— '+(lang==='en'?'or paste CSV below':'o pega CSV abajo')+' —</div>';
  h+='<textarea id="imp-txt" class="import-area" placeholder="Empresa&#9;Jurisdiccion&#9;Director&#9;..."></textarea>';
  h+='<div id="imp-msg"></div><div id="imp-preview"></div>';
  h+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">';
  h+='<button class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button>';
  h+='<button class="btn btn-outline" onclick="runPreview()">'+(lang==='en'?'Preview':'Vista Previa')+'</button>';
  h+='<button class="btn btn-primary" id="imp-confirm" style="display:none" onclick="commitImport()">'+(lang==='en'?'Confirm Import':'Confirmar')+'</button></div></div>';
  showModal(h);
}
function handleDrop(e){var f=e.dataTransfer.files[0];if(f)readFile(f);}
function handleFileSelect(inp){var f=inp.files[0];if(f)readFile(f);}
function readFile(f){
  var isXL=/\.xlsx?$/i.test(f.name);var r=new FileReader();
  r.onload=function(e){
    try{
      var rows;
      if(isXL){var wb=XLSX.read(e.target.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});}
      else rows=parseCSV(e.target.result);
      runPreviewFromRows(rows);
    }catch(err){impMsg(err.message,'err');}
  };
  if(isXL)r.readAsArrayBuffer(f);else r.readAsText(f,'UTF-8');
}
function runPreview(){var txt=document.getElementById('imp-txt');if(!txt||!txt.value.trim()){impMsg('No text','err');return;}runPreviewFromRows(parseCSV(txt.value.trim()));}
function parseCSV(txt){
  var lines=txt.split('\n').filter(function(l){return l.trim();});
  var f=lines[0]||'';
  var d=(f.match(/\t/g)||[]).length>=(f.match(/,/g)||[]).length?'\t':',';
  return lines.map(function(l){return splitLine(l,d);});
}
function splitLine(line,d){var r=[];var cur='';var q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===d&&!q){r.push(cur.trim().replace(/^"|"$/g,''));cur='';}else cur+=c;}r.push(cur.trim().replace(/^"|"$/g,''));return r;}
function ci(heads){var ns=[].slice.call(arguments,1);for(var ni=0;ni<ns.length;ni++){var n=ns[ni];for(var i=0;i<heads.length;i++){if(heads[i].includes(n))return i;}}return -1;}
function runPreviewFromRows(rows){
  if(!rows||rows.length<2){impMsg('Need header + data rows','err');return;}
  var heads=rows[0].map(function(h){return String(h||'').trim().toLowerCase();});
  var iName=ci(heads,'empresa','company name','name');if(iName===-1){impMsg('Cannot find "Empresa" column','err');return;}
  var iJur=ci(heads,'jurisdic'),iPurp=ci(heads,'propós','propos','purpose'),iYear=ci(heads,'año','ano','year','constit'),
    iFisc=ci(heads,'company id','numero fiscal','fiscal'),iEIN=ci(heads,'ein'),iSH=ci(heads,'shareholder','accionista'),
    iDir=ci(heads,'director'),iAddr=ci(heads,'direcci'),iAgent=ci(heads,'registered agent','agente'),
    iBank=ci(heads,'bank ','banco '),iAcc=ci(heads,'account #','acct'),iRoute=ci(heads,'routing','aba'),
    iBAddr=ci(heads,'address for bank'),iSwift=ci(heads,'swift'),iIRS=ci(heads,'irs'),
    iStatus=ci(heads,'status','estado'),iTags=ci(heads,'tags','etiqueta');
  var parsed=[];var skipped=0;
  for(var i=1;i<rows.length;i++){
    var cols=rows[i];var name=String(cols[iName]||'').trim();if(!name){skipped++;continue;}
    var shRaw=iSH>-1?String(cols[iSH]||'').trim():'';
    var shareholders=shRaw?shRaw.split(/[;|]/).map(function(s){var m=s.trim().match(/^(.+?)\s+(\d+(?:\.\d+)?)%?$/);return m?{id:uid(),person:m[1].trim(),pct:parseFloat(m[2]),class:'',type:'individual'}:{id:uid(),person:s.trim(),pct:0,class:'',type:'individual'};}).filter(function(s){return s.person;}):[]; 
    var bName=iBank>-1?String(cols[iBank]||'').trim():'';
    var banking=bName?[{id:uid(),bank:bName,account:iAcc>-1?String(cols[iAcc]||'').trim():'',routing:iRoute>-1?String(cols[iRoute]||'').trim():'',swift:iSwift>-1?String(cols[iSwift]||'').trim():'',bankAddr:iBAddr>-1?String(cols[iBAddr]||'').trim():'',currency:'USD',type:'Checking'}]:[];
    var purp=iPurp>-1?String(cols[iPurp]||'').trim():'';
    parsed.push({id:uid(),name:name,jurisdiction:iJur>-1?String(cols[iJur]||'').trim():'',purpose:purp,yearFounded:iYear>-1?String(cols[iYear]||'').trim():'',fiscalId:iFisc>-1?String(cols[iFisc]||'').trim():'',ein:iEIN>-1?String(cols[iEIN]||'').trim():'',irs:iIRS>-1?String(cols[iIRS]||'').trim():'',director:iDir>-1?String(cols[iDir]||'').trim():'',agent:iAgent>-1?String(cols[iAgent]||'').trim():'',address:iAddr>-1?String(cols[iAddr]||'').trim():'',status:iStatus>-1?String(cols[iStatus]||'active').trim():'active',tags:iTags>-1?String(cols[iTags]||purp).trim():purp,notes:'',shareholders:shareholders,banking:banking,custom:[]});
  }
  _pending=parsed;
  var prev=document.getElementById('imp-preview');
  if(prev){
    var ph='<div style="font-size:13px;font-weight:600;margin:12px 0 8px;color:var(--teal)">'+parsed.length+' '+(lang==='en'?'companies found':'empresas encontradas')+(skipped?' · '+skipped+' skipped':'')+'</div>';
    ph+='<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr><th>Empresa</th><th>Jurisdicción</th><th>Director</th><th>Shareholders</th></tr></thead><tbody>';
    parsed.slice(0,5).forEach(function(c){ph+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.jurisdiction||'—')+'</td><td>'+esc(c.director||'—')+'</td><td>'+esc(c.shareholders.map(function(s){return s.person+' '+s.pct+'%';}).join(', ')||'—')+'</td></tr>';});
    ph+='</tbody></table></div>';
    if(parsed.length>5) ph+='<div style="font-size:11px;color:var(--text3);margin-top:4px">… and '+(parsed.length-5)+' more</div>';
    prev.innerHTML=ph;
  }
  var btn=document.getElementById('imp-confirm');if(btn)btn.style.display='inline-flex';
  impMsg('','ok');
}
function commitImport(){if(!_pending.length)return;data.companies.push.apply(data.companies,_pending);_pending=[];save();closeModal();render();}
function impMsg(msg,type){var el=document.getElementById('imp-msg');if(el)el.innerHTML=msg?'<div class="'+(type==='ok'?'imp-ok':'imp-err')+'">'+msg+'</div>':'';}

// ── Export ────────────────────────────────────────────────────────────────────
function exportAllCSV(){
  var rows=[['Empresa','Jurisdiccion','Propósito','Año','ID Fiscal','EIN','IRS','Director','Registered Agent','Dirección','Estado','Accionistas','Banco','Account #','Routing','SWIFT']];
  data.companies.forEach(function(c){rows.push([c.name,c.jurisdiction,c.purpose,c.yearFounded||c.year,c.fiscalId,c.ein,c.irs,c.director,c.agent,c.address,c.status,c.shareholders.map(function(s){return resolveOwner(s)+' '+s.pct+'%';}).join('; '),(c.banking||[]).map(function(b){return b.bank;}).join('; '),(c.banking||[]).map(function(b){return b.account;}).join('; '),(c.banking||[]).map(function(b){return b.routing;}).join('; '),(c.banking||[]).map(function(b){return b.swift;}).join('; ')]);});
  dlCSV(rows,'famofi_companies.csv');
}
function exportCompanyCSV(id){
  var c=data.companies.find(function(x){return x.id===id;});if(!c)return;
  var subs=getSubs(id);var invs=data.investments.filter(function(i){return i.companyId===id;});
  var rows=[['Field','Value'],['Empresa',c.name],['Jurisdicción',c.jurisdiction],['Propósito',c.purpose],['Año',c.yearFounded||c.year],['ID Fiscal',c.fiscalId],['EIN',c.ein],['IRS',c.irs],['Director',c.director],['Registered Agent',c.agent],['Dirección',c.address],['Estado',c.status],['',''],['--- ACCIONISTAS ---',''],['Nombre','%','Tipo']];
  c.shareholders.forEach(function(s){rows.push([resolveOwner(s),s.pct+'%',s.type]);});
  rows.push(['',''],['--- SUBSIDIARIAS ---','']);
  subs.forEach(function(s){rows.push([s.name,s.jurisdiction,s.status]);});
  rows.push(['',''],['--- INVERSIONES ---',''],['Nombre','Fondo','Tipo','Market Value','Calls','Distribuciones']);
  invs.forEach(function(i){rows.push([i.name,i.fund,i.type,i.marketValue,i.calls,i.distributions]);});
  rows.push(['',''],['--- BANCA ---',''],['Banco','Account #','Routing','SWIFT']);
  (c.banking||[]).forEach(function(b){rows.push([b.bank,b.account,b.routing,b.swift]);});
  dlCSV(rows,c.name.replace(/[^a-z0-9]/gi,'_')+'.csv');
}
function dlCSV(rows,name){
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv);a.download=name;a.click();
}
function printCompany(id){

  h+='<div style="display:flex;justify-content:space-between;margin-bottom:18px"><div><h1>'+c.name+'</h1><div style="color:#666;font-size:12px">'+esc(c.jurisdiction)+' · '+esc(c.yearFounded||c.year||'')+' · '+c.status+'</div></div>';

  [['Jurisdicción',c.jurisdiction],['Propósito',c.purpose],['Año/Fecha',c.yearFounded||c.year],['ID Fiscal',c.fiscalId],['EIN',c.ein],['IRS',c.irs],['Director',c.director],['Registered Agent',c.agent],['Dirección',c.address],['Estado',c.status]].forEach(function(row){if(row[1])h+='<div class="row"><div class="lbl">'+row[0]+'</div><div>'+row[1]+'</div></div>';});
  if(c.shareholders.length){h+='<h3>Shareholders</h3><table><tr><th>Name</th><th>%</th><th>Type</th></tr>';c.shareholders.forEach(function(s){h+='<tr><td>'+resolveOwner(s)+'</td><td>'+s.pct+'%</td><td>'+s.type+'</td></tr>';});h+='</table>';}
  if(subs.length){h+='<h3>Subsidiaries</h3><table><tr><th>Name</th><th>Jurisdiction</th><th>Status</th></tr>';subs.forEach(function(s){h+='<tr><td>'+s.name+'</td><td>'+s.jurisdiction+'</td><td>'+s.status+'</td></tr>';});h+='</table>';}
  if(invs.length){h+='<h3>Investments</h3><table><tr><th>Name</th><th>Fund</th><th>Type</th><th>Market Value</th><th>Calls</th><th>Distributions</th></tr>';invs.forEach(function(i){h+='<tr><td>'+i.name+'</td><td>'+(i.fund||'')+'</td><td>'+i.type+'</td><td>$'+(+i.marketValue||0).toLocaleString()+'</td><td>$'+(+i.calls||0).toLocaleString()+'</td><td>$'+(+i.distributions||0).toLocaleString()+'</td></tr>';});h+='</table>';}
  if((c.banking||[]).length){h+='<h3>Banking</h3><table><tr><th>Bank</th><th>Account</th><th>Routing</th><th>SWIFT</th></tr>';c.banking.forEach(function(b){h+='<tr><td>'+b.bank+'</td><td>'+b.account+'</td><td>'+b.routing+'</td><td>'+b.swift+'</td></tr>';});h+='</table>';}

// ── Modal ─────────────────────────────────────────────────────────────────────
function showModal(html,large){
  var ov=document.getElementById('ov');
  if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='overlay';ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});document.body.appendChild(ov);}
  ov.innerHTML='<div class="modal'+(large?' modal-lg':'')+'">'+html+'</div>';
  ov.style.display='flex';
}
function closeModal(){var ov=document.getElementById('ov');if(ov)ov.style.display='none';}
