<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f8;--surface:#fff;--border:#dde2f0;--border2:#c5ccdf;
  --text:#1e2340;--text2:#5a6080;--text3:#9aa0b8;
  --accent:#4f6ef7;--accent2:#3a57e8;--accent-bg:#eef1fe;
  --teal:#0e9f6e;--teal-bg:#e0f7ee;
  --amber:#d97706;--amber-bg:#fef3c7;
  --red:#e3403a;--red-bg:#fde8e8;
  --coral:#e05c2a;--coral-bg:#fdeee7;
  --purple:#7c3aed;--purple-bg:#ede9fe;
  --blue:#1d83e2;--blue-bg:#e8f3fd;
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 2px 8px rgba(79,110,247,.08);
  --shadow-md:0 4px 20px rgba(79,110,247,.12);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;min-height:100vh}

/* ── Login ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1e2340 0%,#3a57e8 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-logo{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:6px}
.login-logo span{color:var(--text2);font-weight:400}
.login-subtitle{font-size:13px;color:var(--text3);margin-bottom:28px}
.login-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.login-field label{font-size:12px;font-weight:600;color:var(--text2)}
.login-field input{padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s}
.login-btn:hover{background:var(--accent2)}
.login-error{background:var(--red-bg);color:var(--red);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-top:10px;display:none}
.login-role-badge{text-align:center;margin-top:16px;font-size:12px;color:var(--text3)}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── App ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;display:none}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;gap:10px;box-shadow:var(--shadow)}
.logo{font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.logo span{color:var(--text2);font-weight:400}
nav{display:flex;gap:2px}
nav button{background:none;border:none;padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;font-weight:500;transition:all .15s}
nav button:hover{background:var(--accent-bg);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff}
.hdr-right{display:flex;gap:8px;align-items:center}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);transition:background .3s}
.user-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent)}
.admin-badge{background:var(--purple-bg);color:var(--purple)}
.lang-btn{background:none;border:1.5px solid var(--border);padding:4px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);font-family:inherit}
.logout-btn{background:none;border:1.5px solid var(--border);padding:4px 12px;border-radius:20px;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
main{flex:1;overflow-y:auto;padding:24px}

/* ── Read-only banner ── */
.readonly-banner{background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;color:var(--amber);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ── Cards & layout ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.kpi-val{font-size:26px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-title{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;height:160px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--accent)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
select.filter{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;cursor:pointer;font-family:inherit}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-title{font-size:18px;font-weight:700}

/* ── Buttons ── */
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:var(--radius-xs)}
.btn-danger{background:none;border:1.5px solid #fca5a5;color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-teal{background:none;border:1.5px solid #6ee7b7;color:var(--teal)}
.btn-teal:hover{background:var(--teal-bg)}
.btn-purple{background:none;border:1.5px solid #c4b5fd;color:var(--purple)}
.btn-purple:hover{background:var(--purple-bg)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--accent-bg)}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-active{background:var(--teal-bg);color:var(--teal)}
.badge-dormant{background:var(--amber-bg);color:var(--amber)}
.badge-liquidation{background:var(--red-bg);color:var(--red)}
.badge-jur{background:var(--accent-bg);color:var(--accent)}
.badge-inv{background:var(--coral-bg);color:var(--coral)}
.badge-fund{background:var(--purple-bg);color:var(--purple)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(30,35,64,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:760px;max-height:93vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-lg{max-width:920px}
.modal-header{padding:16px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:16px;font-weight:700}
.modal-subtitle{font-size:12px;color:var(--text3);margin-top:2px}
.modal-body{padding:18px 22px}
.close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:2px 6px}
.close-btn:hover{background:var(--red-bg);color:var(--red)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:none;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-weight:500}
.tab:hover{color:var(--accent);background:var(--accent-bg)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;background:var(--accent-bg)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Forms ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label.lbl{font-size:12px;font-weight:600;color:var(--text2)}
input.inp,select.inp,textarea.inp{padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;width:100%;transition:border .15s}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:60px}
.fsec{margin-bottom:18px}
.fsec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border)}

/* ── Misc ── */
.ownership-bar{background:var(--bg);border-radius:4px;height:5px;margin-top:3px;overflow:hidden}
.ownership-fill{background:var(--accent);height:100%;border-radius:4px}
.bank-sensitive{filter:blur(4px);cursor:pointer;transition:filter .2s;user-select:none;font-family:monospace}
.bank-sensitive.revealed{filter:none}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.sh-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.sh-card:hover,.sh-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.holding-chip{background:var(--accent-bg);color:var(--accent);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.inv-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.inv-card:hover{border-color:var(--accent)}
.inv-field-chip{font-size:11px;background:var(--bg);padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.bank-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.dr{display:grid;grid-template-columns:160px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.dr-lbl{font-size:12px;color:var(--text3);font-weight:500}
.dr-val{font-size:13px}
.sh-form-row{display:grid;grid-template-columns:auto 1fr 72px 90px auto;gap:6px;align-items:center;margin-bottom:7px;padding:6px 8px;background:var(--bg);border-radius:var(--radius-xs);border:1px solid var(--border)}
.sh-form-row input,.sh-form-row select{padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;width:100%}
.inv-field-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:7px}

/* ── Org chart ── */
.org-card{border-radius:var(--radius-sm);padding:10px 14px;min-width:130px;max-width:170px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);display:inline-block;margin:4px}
.org-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.org-card-name{font-size:12px;font-weight:700;margin-bottom:2px}
.org-card-sub{font-size:10px;color:var(--text3)}

/* ── Network export ── */
.net-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* ── Import table ── */
.import-table-wrap{overflow-x:auto;margin-top:12px;max-height:320px;overflow-y:auto}
.import-table{width:100%;border-collapse:collapse;font-size:12px}
.import-table th{background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:700;padding:6px 8px;border:1px solid var(--border);white-space:nowrap}
.import-table td{padding:4px 6px;border:1px solid var(--border)}
.import-table input{width:100%;border:none;outline:none;font-size:12px;font-family:inherit;background:transparent;color:var(--text)}
.import-table tr.skip{opacity:.4}
.import-table td.skip-cell{text-align:center;width:36px}

/* ── Documents ── */
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px}
.doc-icon{font-size:20px;flex-shrink:0}
.doc-name{flex:1;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:11px;color:var(--text3)}
.drop-upload{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.drop-upload:hover{border-color:var(--accent);background:var(--accent-bg)}

/* ── Import hint ── */
.import-hint{background:var(--accent-bg);border-radius:var(--radius-sm);padding:11px 14px;font-size:12px;color:var(--accent);margin-bottom:12px;border-left:3px solid var(--accent);line-height:1.6}
.imp-ok{background:var(--teal-bg);color:var(--teal);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.imp-err{background:var(--red-bg);color:var(--red);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.drop-zone:hover{border-color:var(--accent);background:var(--accent-bg)}

/* ── Col map ── */
.col-map{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.col-map select{padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);outline:none}

@media(max-width:700px){.kpi-grid{grid-template-columns:1fr 1fr}.charts-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">FamOfi <span>Registry</span></div>
    <div class="login-subtitle">Secure access — authorized users only</div>
    <div class="login-field"><label>Email</label><input type="email" id="li-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="login-field"><label>Password</label><input type="password" id="li-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="li-err"></div>
    <div class="login-role-badge">🔒 Private system — FamOfi</div>
  </div>
</div>

<!-- Loading -->
<div id="loading" style="display:none"><div class="spinner"></div><div style="color:var(--text2);font-size:13px">Loading FamOfi…</div></div>

<!-- App -->
<div id="app">
  <header>
    <div class="logo">FamOfi <span>Registry</span></div>
    <nav id="nav"></nav>
    <div class="hdr-right">
      <div id="sync-dot" title="Sync"></div>

      <button class="lang-btn" id="langBtn" onclick="toggleLang()">ES</button>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </header>
  <main id="main"></main>
</div>

// ── Data ──────────────────────────────────────────────────────────────────────
var data={companies:[],investments:[]};
var _saveTimer=null;
var _unsubscribe=null;

function save(){
  if(userRole!=='admin'){return;} // only admins can save
  setSyncDot('saving');
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){
    localStorage.setItem('fm_data',JSON.stringify(data));
    _REF.set({payload:JSON.stringify(data)}).then(function(){setSyncDot('ok');}).catch(function(){setSyncDot('error');});
  },500);
}
function setSyncDot(s){
  var d=document.getElementById('sync-dot');if(!d)return;
  if(s==='saving'){d.style.background='var(--amber)';}
  else if(s==='error'){d.style.background='var(--red)';}
  else{d.style.background='var(--teal)';}
}
function uid(){return '_'+Math.random().toString(36).slice(2,9);}
function cname(id){var c=data.companies.find(function(x){return x.id===id;});return c?c.name:id;}
function resolveOwner(sh){return sh.type==='company'?cname(sh.person):sh.person;}
function getSubs(pid){return data.companies.filter(function(c){return c.shareholders.some(function(s){return s.type==='company'&&s.person===pid;});});}
function getParents(cid){return data.companies.filter(function(p){return getSubs(p.id).some(function(s){return s.id===cid;});});}
function fmtD(n){return (n!=null&&n!=='') ? '$'+(+n).toLocaleString() : '—';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function q(id){return "'"+id+"'";}
function sBadge(s){
  if(s==='active') return '<span class="badge badge-active">'+t('active')+'</span>';
  if(s==='dormant') return '<span class="badge badge-dormant">'+t('dormant')+'</span>';
  return '<span class="badge badge-liquidation">'+t('liquidation')+'</span>';
}
function dr(label,val){
  if(!val&&val!==0) return '';
  return '<div class="dr"><div class="dr-lbl">'+label+'</div><div class="dr-val">'+val+'</div></div>';
}
function isAdmin(){return userRole==='admin';}

function applyLoaded(d){
  data=d;
  if(!data.investments) data.investments=[];
  data.companies.forEach(function(c){
    c.shareholders.forEach(function(s){if(!s.type)s.type='individual';});
    if(!c.banking) c.banking=[];
    if(!c.custom) c.custom=[];
    if(!c.yearFounded&&c.year) c.yearFounded=String(c.year);
    if(!c.documents) c.documents=[];
  });
  data.investments.forEach(function(inv){
    if(inv.commitment==null)inv.commitment=0;
    if(inv.calls==null)inv.calls=0;
    if(inv.distributions==null)inv.distributions=0;
    if(inv.marketValue==null)inv.marketValue=0;
    if(!inv.fund)inv.fund='';
    if(!inv.family)inv.family='';
    if(!inv.fields)inv.fields=[];
  });
}

// ── Auth listener ─────────────────────────────────────────────────────────────
_auth.onAuthStateChanged(function(user){
  if(user){
    currentUser=user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('loading').style.display='flex';
    // Load role from Firestore
    _ROLES_REF.get().then(function(snap){
      var roles=(snap.exists&&snap.data())||{};
      userRole=(roles[user.uid]||roles[user.email]||'viewer');
      // Update badge
      var badge=document.getElementById('user-badge');
      if(badge){
        badge.textContent=isAdmin()?'Admin':'Viewer';
        badge.className='user-badge'+(isAdmin()?' admin-badge':'');
      }
      // Show/hide import button
      var ib=document.getElementById('import-btn');
      if(ib)ib.style.display=isAdmin()?'':'none';
      // Load data
      var ls=localStorage.getItem('fm_data');
      if(ls){try{applyLoaded(JSON.parse(ls));}catch(e){}}
      _REF.get().then(function(s){
        if(s.exists){try{applyLoaded(JSON.parse(s.data().payload));}catch(e){}}
        startSubscription();
        document.getElementById('loading').style.display='none';
        document.getElementById('app').style.display='flex';
        render();
      }).catch(function(){
        startSubscription();
        document.getElementById('loading').style.display='none';
        document.getElementById('app').style.display='flex';
        render();
      });
    }).catch(function(){
      userRole='viewer';
      startSubscription();
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='flex';
      render();
    });
  } else {
    currentUser=null;userRole='viewer';
    if(_unsubscribe){_unsubscribe();_unsubscribe=null;}
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='none';
  }
});

function startSubscription(){
  if(_unsubscribe) _unsubscribe();
  _unsubscribe=_REF.onSnapshot(function(snap){
    if(snap.exists){try{applyLoaded(JSON.parse(snap.data().payload));render();}catch(e){}}
  },function(){});
}

var page='overview';
var pages=['overview','companies','shareholders','investments','network'];
function go(p){page=p;render();}

// ── Charts ────────────────────────────────────────────────────────────────────
var COLORS=['#4f6ef7','#0e9f6e','#f59e0b','#7c3aed','#e3403a','#1d83e2','#10b981','#f97316','#8b5cf6','#ef4444'];
var charts={};
function destroyCharts(){Object.values(charts).forEach(function(c){try{c.destroy();}catch(e){}});charts={};}
function mkChart(id,type,labels,values){
  var ctx=document.getElementById(id);if(!ctx)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:type,
    data:{labels:labels,datasets:[{data:values,backgroundColor:COLORS.slice(0,labels.length),borderWidth:0,borderRadius:type==='bar'?5:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:type!=='bar',position:'bottom',labels:{boxWidth:10,font:{size:10},padding:8}}},
      scales:type==='bar'?{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#eef0f8'},ticks:{font:{size:10},stepSize:1}}}:undefined
    }
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  var nav=document.getElementById('nav');
  if(nav){
    nav.innerHTML='';
    pages.forEach(function(p){
      var b=document.createElement('button');
      b.textContent=t(p);b.className=p===page?'active':'';
      b.onclick=function(){go(p);};nav.appendChild(b);
    });
  }
  destroyCharts();
  var m=document.getElementById('main');if(!m)return;
  if(page==='overview'){m.innerHTML=renderOverview();setTimeout(buildOvCharts,50);}
  else if(page==='companies'){m.innerHTML=renderCompanies();}
  else if(page==='shareholders'){m.innerHTML=renderShareholders();}
  else if(page==='investments'){m.innerHTML=renderInvestments();setTimeout(buildInvCharts,50);}
  else if(page==='network'){m.innerHTML=renderNetwork();}
}
function renderPage(){
  var m=document.getElementById('main');if(!m)return;
  destroyCharts();
  if(page==='companies'){m.innerHTML=renderCompanies();}
  else if(page==='shareholders'){m.innerHTML=renderShareholders();}
  else if(page==='investments'){m.innerHTML=renderInvestments();setTimeout(buildInvCharts,50);}
  else if(page==='network'){m.innerHTML=renderNetwork();}
}

}

// ── Documents ─────────────────────────────────────────────────────────────────
function renderDocuments(cid){
  var c=data.companies.find(function(x){return x.id===cid;});if(!c)return '';
  var docs=c.documents||[];
  var h='';
  if(isAdmin()){
    h+='<div class="drop-upload" onclick="document.getElementById(\'doc-file-'+cid+'\').click()">';
    h+='<div style="font-size:24px;margin-bottom:6px">📎</div>';
    h+='<div style="font-weight:600">'+t('uploadDoc')+'</div>';
    h+='<div style="font-size:11px;color:var(--text3);margin-top:3px">PDF · DOCX · XLSX · PPTX</div>';
    h+='<input id="doc-file-'+cid+'" type="file" accept=".pdf,.docx,.xlsx,.pptx,.doc,.xls,.ppt" multiple style="display:none" onchange="uploadDocuments('+q(cid)+',this)"></div>';
  }
  h+='<div id="doc-list-'+cid+'">';
  if(docs.length){
    docs.forEach(function(doc,di){
      var icon=docIcon(doc.name);
      h+='<div class="doc-row">';
      h+='<div class="doc-icon">'+icon+'</div>';
      h+='<div><div class="doc-name">'+esc(doc.name)+'</div>';
      h+='<div class="doc-meta">'+(doc.size?fmtSize(doc.size)+' · ':'')+esc(doc.uploadedAt||'')+'</div></div>';
      h+='<div style="display:flex;gap:6px;margin-left:auto">';
      h+='<a href="'+esc(doc.url)+'" target="_blank" download="'+esc(doc.name)+'" class="btn btn-teal btn-sm">⬇ Download</a>';
      if(isAdmin()) h+='<button class="btn btn-danger btn-sm" onclick="deleteDocument('+q(cid)+','+di+')">×</button>';
      h+='</div></div>';
    });
  } else {h+='<div class="empty"><div style="font-size:28px;margin-bottom:8px">📄</div>'+t('noDocuments')+'</div>';}
  h+='</div>';
  return h;
}
function docIcon(name){
  var ext=(name||'').split('.').pop().toLowerCase();
  if(ext==='pdf') return '📕';
  if(ext==='docx'||ext==='doc') return '📘';
  if(ext==='xlsx'||ext==='xls') return '📗';
  if(ext==='pptx'||ext==='ppt') return '📙';
  return '📄';
}
function fmtSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1048576) return Math.round(bytes/1024)+'KB';
  return (bytes/1048576).toFixed(1)+'MB';
}
function uploadDocuments(cid,input){
  var files=Array.from(input.files);if(!files.length)return;
  var c=data.companies.find(function(x){return x.id===cid;});if(!c)return;
  if(!c.documents)c.documents=[];
  var listEl=document.getElementById('doc-list-'+cid);
  if(listEl)listEl.innerHTML='<div style="padding:16px;color:var(--text3)">Uploading…</div>';
  var promises=files.map(function(file){
    var path='famofi/'+cid+'/'+Date.now()+'_'+file.name;
    var ref=_storage.ref(path);
    return ref.put(file).then(function(){return ref.getDownloadURL();}).then(function(url){
      return {name:file.name,url:url,size:file.size,path:path,uploadedAt:new Date().toLocaleDateString()};
    });
  });
  Promise.all(promises).then(function(docs){
    docs.forEach(function(d){c.documents.push(d);});
    save();
    if(listEl)listEl.innerHTML=renderDocumentsInner(cid);
  }).catch(function(e){
    if(listEl)listEl.innerHTML='<div class="imp-err">Upload failed: '+e.message+'</div>';
  });
}
function renderDocumentsInner(cid){
  var c=data.companies.find(function(x){return x.id===cid;});if(!c)return '';
  var docs=c.documents||[];
  if(!docs.length) return '<div class="empty">'+t('noDocuments')+'</div>';
  var h='';
  docs.forEach(function(doc,di){
    var icon=docIcon(doc.name);
    h+='<div class="doc-row"><div class="doc-icon">'+icon+'</div>';
    h+='<div><div class="doc-name">'+esc(doc.name)+'</div>';
    h+='<div class="doc-meta">'+(doc.size?fmtSize(doc.size)+' · ':'')+esc(doc.uploadedAt||'')+'</div></div>';
    h+='<div style="display:flex;gap:6px;margin-left:auto">';
    h+='<a href="'+esc(doc.url)+'" target="_blank" class="btn btn-teal btn-sm">⬇ Download</a>';
    if(isAdmin()) h+='<button class="btn btn-danger btn-sm" onclick="deleteDocument('+q(cid)+','+di+')">×</button>';
    h+='</div></div>';
  });
  return h;
}
function deleteDocument(cid,di){
  if(!confirm(lang==='en'?'Delete this document?':'¿Eliminar este documento?'))return;
  var c=data.companies.find(function(x){return x.id===cid;});if(!c)return;
  var doc=c.documents[di];
  if(doc&&doc.path){
    _storage.ref(doc.path).delete().catch(function(){});
  }
  c.documents.splice(di,1);
  save();
  var listEl=document.getElementById('doc-list-'+cid);
  if(listEl)listEl.innerHTML=renderDocumentsInner(cid);
}

function saveCompany(id){
  var banking=id?(data.companies.find(function(c){return c.id===id;})||{banking:[]}).banking:[];
  var custom=id?(data.companies.find(function(c){return c.id===id;})||{custom:[]}).custom:[];

  var obj={id:id||uid(),name:gv('f-name'),jurisdiction:gv('f-jur'),status:gv('f-status'),yearFounded:gv('f-year'),
    purpose:gv('f-purpose'),tags:gv('f-tags'),fiscalId:gv('f-fiscal'),ein:gv('f-ein'),irs:gv('f-irs'),
    director:gv('f-director'),agent:gv('f-agent'),address:gv('f-address'),notes:gv('f-notes'),

function delCompany(id){

var invSearch='',invFundF='',invTypeF='';
function renderInvestments(){
  var inv=data.investments.filter(function(i){
    var q2=invSearch.toLowerCase();
    return(!q2||(i.name+(i.fund||'')+i.type+cname(i.companyId)).toLowerCase().includes(q2))
      &&(!invFundF||i.fund===invFundF)&&(!invTypeF||i.type===invTypeF);
  });
  var funds=[...new Set(data.investments.map(function(i){return i.fund;}).filter(Boolean))].sort();
  var types=[...new Set(data.investments.map(function(i){return i.type;}).filter(Boolean))].sort();
  var totalMV=inv.reduce(function(a,i){return a+(+i.marketValue||0);},0);
  var totalC=inv.reduce(function(a,i){return a+(+i.commitment||0);},0);
  var totalD=inv.reduce(function(a,i){return a+(+i.distributions||0);},0);
  var h=roBanner();
  h+='<div class="section-header"><div class="section-title">'+t('investments')+' <span style="color:var(--text3);font-weight:400;font-size:14px">('+data.investments.length+')</span></div>';

  h+='<div class="kpi"><div class="kpi-label">'+t('invCommit')+'</div><div class="kpi-val" style="font-size:20px">'+fmtD(totalC)+'</div></div>';
  h+='<div class="kpi"><div class="kpi-label">'+t('invDist')+'</div><div class="kpi-val" style="font-size:20px;color:var(--teal)">'+fmtD(totalD)+'</div></div>';
  h+='<div class="kpi"><div class="kpi-label"># '+t('investments')+'</div><div class="kpi-val" style="font-size:20px">'+data.investments.length+'</div></div></div>';

  h+='<select class="filter" onchange="invFundF=this.value;renderPage()"><option value="">'+t('allFunds')+'</option>';
  funds.forEach(function(f){h+='<option value="'+esc(f)+'"'+(invFundF===f?' selected':'')+'>'+esc(f)+'</option>';});
  h+='</select><select class="filter" onchange="invTypeF=this.value;renderPage()"><option value="">'+t('allTypes')+'</option>';
  types.forEach(function(t2){h+='<option value="'+esc(t2)+'"'+(invTypeF===t2?' selected':'')+'>'+esc(t2)+'</option>';});
  h+='</select></div>';
  h+='<div class="card" style="padding:0"><table><thead><tr><th>'+t('invName')+'</th><th>'+t('invFund')+'</th><th>'+t('invCompany')+'</th><th>'+t('invType')+'</th><th>'+t('invMV')+'</th><th>'+t('invCalls')+'</th><th>'+t('invDist')+'</th><th>'+t('invStatus')+'</th><th></th></tr></thead><tbody>';

  else{inv.forEach(function(i){
    h+='<tr><td style="font-weight:600">'+esc(i.name)+'</td>';
    h+='<td>'+(i.fund?'<span class="badge badge-fund">'+esc(i.fund)+'</span>':'—')+'</td>';

    h+='<td><span class="badge badge-inv">'+esc(i.type||'—')+'</span></td>';
    h+='<td style="font-weight:600">'+fmtD(i.marketValue)+'</td><td>'+fmtD(i.calls)+'</td>';
    h+='<td style="color:var(--teal)">'+fmtD(i.distributions)+'</td>';
    h+='<td>'+(i.status?'<span class="badge badge-active">'+esc(i.status)+'</span>':'—')+'</td>';

// ── Network (ALL companies shown) ─────────────────────────────────────────────
function renderNetwork(){
  var cs=data.companies;
  // Build ownership edges
  var edges=[];
  cs.forEach(function(c){
    c.shareholders.forEach(function(s){
      if(s.type==='company'){
        edges.push({from:s.person,to:c.id,pct:s.pct});
      }
    });
  });

  // Build tree starting from all shareholders (individuals + roots)
  var ownedIds=new Set(edges.map(function(e){return e.to;}));
  var roots=cs.filter(function(c){return !ownedIds.has(c.id);}); // not owned by any company
  var standalone=cs.filter(function(c){return !ownedIds.has(c.id)&&!getSubs(c.id).length&&!c.shareholders.some(function(s){return s.type==='individual';});}); 

  function treeNode(c,depth){
    var subs=getSubs(c.id);
    var indiv=c.shareholders.filter(function(s){return s.type==='individual';});
    var ic=data.investments.filter(function(i){return i.companyId===c.id;}).length;
    var col=depth===0?'var(--purple)':'var(--accent)';
    var bg=depth===0?'var(--purple-bg)':'var(--accent-bg)';
    var ml=depth*28;
    var h='<div style="margin-left:'+ml+'px;'+(depth?'border-left:2px dashed var(--border2);padding-left:14px;margin-top:4px':'')+'margin-bottom:4px">';
    h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1.5px solid '+col+';background:'+bg+';margin-bottom:4px" onclick="openCompany('+q(c.id)+')">';
    h+='<span>'+(depth===0?'🏢':'↳')+'</span>';
    h+='<span style="font-weight:700;color:'+col+'">'+esc(c.name)+'</span>';
    h+='<span class="badge badge-jur" style="font-size:10px">'+esc(c.jurisdiction)+'</span>';
    h+=sBadge(c.status);
    if(indiv.length) h+='<span style="font-size:11px;color:var(--text3)">'+indiv.map(function(s){return esc(s.person)+' '+s.pct+'%';}).join(', ')+'</span>';
    if(ic) h+='<span class="badge badge-inv" style="font-size:10px">'+ic+' inv.</span>';
    h+='</div>';
    subs.forEach(function(s){h+=treeNode(s,depth+1);});
    h+='</div>';
    return h;
  }

  var h='<div class="section-header"><div class="section-title">'+t('networkTitle')+'</div>';
  h+='<div style="display:flex;gap:8px">';
  h+='<button class="btn btn-teal btn-sm" onclick="downloadNetworkPNG()">⬇ '+t('downloadChart')+'</button>';
  h+='<button class="btn btn-outline btn-sm" onclick="printNetwork()">🖨 '+t('printChart')+'</button>';
  h+='</div></div>';
  h+='<div class="card" style="margin-bottom:12px;padding:10px 16px;font-size:12px;color:var(--text2)">';
  h+=lang==='en'?'Purple = root companies · Indented = subsidiaries · Click any row to open':'Morado = empresas raíz · Indentadas = subsidiarias · Clic para abrir';
  h+='</div>';
  h+='<div class="card" id="network-tree">';
  if(cs.length===0){h+='<div class="empty">'+t('noData')+'</div>';}
  else{
    // Show ALL companies — rooted ones in tree, orphans flat at bottom
    var shown=new Set();
    roots.forEach(function(c,i){
      h+=treeNode(c,0);shown.add(c.id);
      if(i<roots.length-1) h+='<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">';
    });
    // Any companies not reachable from roots (shouldn't happen but safety net)
    var orphans=cs.filter(function(c){return !shown.has(c.id);});
    if(orphans.length){
      h+='<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">';
      orphans.forEach(function(c){h+=treeNode(c,0);shown.add(c.id);});
    }
  }
  h+='</div>';
  return h;
}

var _importRows=[];     // raw parsed rows
var _importHeaders=[];  // detected headers
var _importMapping={};  // colName -> systemField
var _importEditable=[];  // editable preview rows

var SYSTEM_FIELDS=['Empresa','Jurisdiccion','Propósito','Año','ID Fiscal','EIN','IRS','Director','Registered Agent','Dirección','Estado','Tags','Accionistas','Banco','Account #','Routing','SWIFT'];

function openImport(){

  h+='<textarea id="imp-txt" style="width:100%;min-height:80px;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:monospace;outline:none" placeholder="Empresa,Jurisdiccion,Director..."></textarea>';
  h+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">';
  h+='<button class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button>';
  h+='<button class="btn btn-primary" onclick="parseImportText()">'+(lang==='en'?'Parse & Map':'Analizar')+'</button></div>';
  h+='<div id="imp-map-area"></div>';
  h+='<div id="imp-preview-area"></div>';
  h+='<div id="imp-msg"></div>';
  h+='</div>';
  showModal(h,true);
}
function handleImportDrop(e){var f=e.dataTransfer.files[0];if(f)readImportFile(f);}
function handleImportFile(inp){var f=inp.files[0];if(f)readImportFile(f);}
function readImportFile(f){
  var isXL=/\.xlsx?$/i.test(f.name);var r=new FileReader();
  r.onload=function(e){
    try{
      var rows;
      if(isXL){var wb=XLSX.read(e.target.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});}
      else rows=parseCSVRaw(e.target.result);
      showImportMapping(rows);
    }catch(err){showImpMsg(err.message,'err');}
  };
  if(isXL)r.readAsArrayBuffer(f);else r.readAsText(f,'UTF-8');
}
function parseImportText(){
  var txt=document.getElementById('imp-txt');
  if(!txt||!txt.value.trim()){showImpMsg('No text','err');return;}
  showImportMapping(parseCSVRaw(txt.value.trim()));
}
function parseCSVRaw(txt){var lines=txt.split('\n').filter(function(l){return l.trim();});var f=lines[0]||'';var d=(f.match(/\t/g)||[]).length>=(f.match(/,/g)||[]).length?'\t':',';return lines.map(function(l){return splitLine(l,d);});}
function splitLine(line,d){var r=[];var cur='';var q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===d&&!q){r.push(cur.trim().replace(/^"|"$/g,''));cur='';}else cur+=c;}r.push(cur.trim().replace(/^"|"$/g,''));return r;}

function showImportMapping(rows){
  if(!rows||rows.length<2){showImpMsg('Need at least 2 rows','err');return;}
  _importRows=rows;
  _importHeaders=rows[0].map(function(h){return String(h||'').trim();});
  // Auto-detect mapping
  _importMapping={};
  var sysFl=['Empresa','Jurisdiccion','Propósito','Año','ID Fiscal','EIN','IRS','Director','Registered Agent','Dirección','Estado','Tags','Accionistas','Banco','Account #','Routing','SWIFT'];
  var keywords={
    'Empresa':['empresa','company','nombre','name'],
    'Jurisdiccion':['jurisdic','jurisdiction'],
    'Propósito':['propós','propos','purpose','prop'],
    'Año':['año','ano','year','fecha','date','constit'],
    'ID Fiscal':['company id','fiscal','nif','rut','id/'],
    'EIN':['ein'],
    'IRS':['irs'],
    'Director':['director','administrador'],
    'Registered Agent':['registered agent','agente'],
    'Dirección':['direcci','domicilio','address'],
    'Estado':['status','estado'],
    'Tags':['tags','etiqueta'],
    'Accionistas':['shareholder','accionista'],
    'Banco':['bank','banco'],
    'Account #':['account','cuenta','acct'],
    'Routing':['routing','aba'],
    'SWIFT':['swift']
  };
  _importHeaders.forEach(function(h){
    var hl=h.toLowerCase();
    sysFl.forEach(function(sf){
      if(!_importMapping[sf]){
        var kws=keywords[sf]||[];
        kws.forEach(function(kw){if(hl.includes(kw))_importMapping[sf]=h;});
      }
    });
  });

  // Show mapping UI
  var ma=document.getElementById('imp-map-area');if(!ma)return;
  var mh='<div class="fsec" style="margin-top:16px"><div class="fsec-title">'+(lang==='en'?'Column Mapping (detected automatically — adjust if needed)':'Mapeo de Columnas (detectado — ajusta si es necesario)')+'</div>';
  mh+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  SYSTEM_FIELDS.forEach(function(sf){
    mh+='<div style="display:flex;align-items:center;gap:8px;font-size:12px">';
    mh+='<div style="min-width:120px;font-weight:600;color:var(--text2)">'+sf+'</div>';
    mh+='<select id="map-'+sf.replace(/[^a-z]/gi,'_')+'" style="flex:1;padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);outline:none">';
    mh+='<option value="">— skip —</option>';
    _importHeaders.forEach(function(h){mh+='<option value="'+esc(h)+'"'+(_importMapping[sf]===h?' selected':'')+'>'+esc(h)+'</option>';});
    mh+='</select></div>';
  });
  mh+='</div>';
  mh+='<div style="display:flex;justify-content:flex-end;margin-top:10px">';
  mh+='<button class="btn btn-primary btn-sm" onclick="buildImportPreview()">'+(lang==='en'?'Preview Data →':'Vista Previa →')+'</button></div></div>';
  ma.innerHTML=mh;
}

function buildImportPreview(){
  // Read current mapping from selects
  SYSTEM_FIELDS.forEach(function(sf){
    var sel=document.getElementById('map-'+sf.replace(/[^a-z]/gi,'_'));
    if(sel) _importMapping[sf]=sel.value||'';
  });

  // Build editable rows
  _importEditable=[];
  for(var i=1;i<_importRows.length;i++){
    var cols=_importRows[i];
    function colVal(sf){var col=_importMapping[sf];if(!col)return '';var idx=_importHeaders.indexOf(col);return idx>-1?String(cols[idx]||'').trim():'';}
    if(!colVal('Empresa')){continue;} // skip empty names
    _importEditable.push({
      _skip:false,
      Empresa:colVal('Empresa'),Jurisdiccion:colVal('Jurisdiccion'),Propósito:colVal('Propósito'),
      Año:colVal('Año'),'ID Fiscal':colVal('ID Fiscal'),EIN:colVal('EIN'),IRS:colVal('IRS'),
      Director:colVal('Director'),'Registered Agent':colVal('Registered Agent'),Dirección:colVal('Dirección'),
      Estado:colVal('Estado')||'active',Tags:colVal('Tags'),Accionistas:colVal('Accionistas'),
      Banco:colVal('Banco'),'Account #':colVal('Account #'),Routing:colVal('Routing'),SWIFT:colVal('SWIFT')
    });
  }

  var pa=document.getElementById('imp-preview-area');if(!pa)return;
  var ph='<div class="fsec" style="margin-top:16px"><div class="fsec-title">'+(lang==='en'?'Edit Before Import ('+_importEditable.length+' rows — uncheck to skip)':'Editar Antes de Importar ('+_importEditable.length+' filas)')+'</div>';
  ph+='<div class="import-table-wrap"><table class="import-table"><thead><tr><th>✓</th><th>Empresa</th><th>Jurisdiccion</th><th>Año</th><th>Director</th><th>Accionistas</th><th>Banco</th><th>Estado</th></tr></thead><tbody id="imp-table-body"></tbody></table></div>';
  ph+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">';
  ph+='<button class="btn btn-outline btn-sm" onclick="document.getElementById(\'imp-preview-area\').innerHTML=\'\'">'+(lang==='en'?'Back':'Atrás')+'</button>';
  ph+='<button class="btn btn-primary" onclick="confirmImport()">'+(lang==='en'?'Confirm Import ('+_importEditable.length+')':'Confirmar ('+_importEditable.length+')')+'</button></div></div>';
  pa.innerHTML=ph;
  renderImportTable();
}

function renderImportTable(){
  var tb=document.getElementById('imp-table-body');if(!tb)return;
  var h='';
  _importEditable.forEach(function(row,i){
    h+='<tr class="'+(row._skip?'skip':'')+'">';
    h+='<td class="skip-cell"><input type="checkbox" '+(row._skip?'':'checked')+' onchange="_importEditable['+i+']._skip=!this.checked;renderImportTable()"></td>';
    ['Empresa','Jurisdiccion','Año','Director','Accionistas','Banco','Estado'].forEach(function(f){
      h+='<td><input value="'+esc(row[f]||'')+'" oninput="_importEditable['+i+'][\''+f+'\']=this.value" '+(row._skip?'disabled':'')+' style="width:100%;border:none;outline:none;font-size:12px;font-family:inherit;background:transparent;color:var(--text)"></td>';
    });
    h+='</tr>';
  });
  tb.innerHTML=h;
}

function confirmImport(){
  var toImport=_importEditable.filter(function(r){return !r._skip;});
  if(!toImport.length){showImpMsg('No rows selected','err');return;}
  toImport.forEach(function(row){
    var shRaw=row['Accionistas']||'';
    var shareholders=shRaw?shRaw.split(/[;|]/).map(function(s){var m=s.trim().match(/^(.+?)\s+(\d+(?:\.\d+)?)%?$/);return m?{id:uid(),person:m[1].trim(),pct:parseFloat(m[2]),class:'',type:'individual'}:{id:uid(),person:s.trim(),pct:0,class:'',type:'individual'};}).filter(function(s){return s.person;}):[]; 
    var banking=row['Banco']?[{id:uid(),bank:row['Banco'],account:row['Account #']||'',routing:row['Routing']||'',swift:row['SWIFT']||'',bankAddr:'',currency:'USD',type:'Checking'}]:[];
    data.companies.push({id:uid(),name:row['Empresa'],jurisdiction:row['Jurisdiccion'],purpose:row['Propósito'],yearFounded:row['Año'],fiscalId:row['ID Fiscal'],ein:row['EIN'],irs:row['IRS'],director:row['Director'],agent:row['Registered Agent'],address:row['Dirección'],status:row['Estado']||'active',tags:row['Tags']||row['Propósito'],notes:'',shareholders:shareholders,banking:banking,custom:[],documents:[]});
  });
  save();closeModal();render();
  showImpMsg(toImport.length+' '+(lang==='en'?'companies imported.':'empresas importadas.'),'ok');
}

function exportAllCSV(){
  var rows=[['Empresa','Jurisdiccion','Propósito','Año','ID Fiscal','EIN','IRS','Director','Registered Agent','Dirección','Estado','Accionistas','Banco','Account #','Routing','SWIFT']];
  data.companies.forEach(function(c){rows.push([c.name,c.jurisdiction,c.purpose,c.yearFounded||c.year,c.fiscalId,c.ein,c.irs,c.director,c.agent,c.address,c.status,c.shareholders.map(function(s){return resolveOwner(s)+' '+s.pct+'%';}).join('; '),(c.banking||[]).map(function(b){return b.bank;}).join('; '),(c.banking||[]).map(function(b){return b.account;}).join('; '),(c.banking||[]).map(function(b){return b.routing;}).join('; '),(c.banking||[]).map(function(b){return b.swift;}).join('; ')]);});

function dlCSV(rows,name){var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv);a.download=name;a.click();}

function showModal(html,large){
  var ov=document.getElementById('ov');
  if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='overlay';ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});document.body.appendChild(ov);}
  ov.innerHTML='<div class="modal'+(large?' modal-lg':'')+'">'+html+'</div>';ov.style.display='flex';
}
function closeModal(){var ov=document.getElementById('ov');if(ov)ov.style.display='none';}
