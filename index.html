<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:760px;max-height:93vh;overflow-y:auto;box-shadow:var(--shadow-md)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.fsec{margin-bottom:18px}

.sh-form-row{display:grid;grid-template-columns:auto 1fr 72px 90px auto;gap:6px;align-items:center;margin-bottom:7px;padding:6px 8px;background:var(--bg);border-radius:var(--radius-xs);border:1px solid var(--border)}
.sh-form-row input,.sh-form-row select{padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;width:100%}
.ownership-bar{background:var(--bg);border-radius:4px;height:5px;margin-top:3px;overflow:hidden}

.bank-sensitive{filter:blur(4px);cursor:pointer;transition:filter .2s;user-select:none;font-family:monospace}

.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.sh-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.sh-card:hover,.sh-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.holding-chip{background:var(--accent-bg);color:var(--accent);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600} .sh-chip{display:inline-block;background:var(--accent-bg);color:var(--accent);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin:2px 4px 2px 0} .ov-sh-wrap{line-height:1.8} .ov-sh-hidden{display:none} .ov-sh-toggle{background:none;border:none;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;padding:2px 6px;text-decoration:underline;font-family:inherit}

.inv-field-chip{font-size:11px;background:var(--bg);padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.bank-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.dr{display:grid;grid-template-columns:160px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}

.inv-field-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:7px}
.org-chart-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;padding-bottom:6px;-webkit-overflow-scrolling:touch}.org-charts-layout{display:flex;gap:16px;align-items:flex-start}.org-filter-sidebar{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}.org-filter-section{padding:14px 16px}.org-filter-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:8px}.org-filter-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;background:var(--bg)}.org-filter-option{display:flex;align-items:center;gap:7px;padding:4px 2px;font-size:12.5px;cursor:pointer}.org-filter-option input{cursor:pointer;flex-shrink:0}.org-card-abs{position:absolute}.org-static-edges{position:absolute}@media(max-width:900px){.org-charts-layout{flex-direction:column}.org-filter-sidebar{width:100%}.org-filter-list{max-height:160px}}

  .org-chart-viewport{position:relative;width:100%;height:min(70vh,640px);min-height:360px;overflow:hidden;border-radius:var(--radius-sm);background:var(--bg);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}

.imp-ok{background:var(--teal-bg);color:var(--teal);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.imp-err{background:var(--red-bg);color:var(--red);padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:8px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.drop-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px}
.doc-icon{font-size:20px;flex-shrink:0}
.doc-name{flex:1;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:11px;color:var(--text3)}
.drop-upload{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.drop-upload:hover{border-color:var(--accent);background:var(--accent-bg)}
.import-table-wrap{overflow-x:auto;margin-top:12px;max-height:320px;overflow-y:auto}
.import-table{width:100%;border-collapse:collapse;font-size:12px}
.import-table th{background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:700;padding:6px 8px;border:1px solid var(--border)}
.import-table td{padding:4px 6px;border:1px solid var(--border)}
.import-table tr.skip{opacity:.4}
@media(max-width:700px){
  /* Layout */
  header{height:auto;padding:8px 12px;flex-wrap:wrap;gap:6px}
  nav{width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  nav button{white-space:nowrap;padding:6px 10px;font-size:11px}
  .hdr-right{gap:5px}
  .lang-btn,.logout-btn{padding:4px 8px;font-size:11px}
  #import-btn{padding:4px 8px;font-size:11px}
  main{padding:12px}
  /* KPI grid */
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-val{font-size:20px}
  /* Charts */
  .charts-row{grid-template-columns:1fr}
  /* Tables — horizontal scroll */
  .card{padding:12px 10px;overflow-x:auto}
  table{min-width:500px}
  th,td{padding:7px 8px;font-size:12px}
  /* Forms */
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:1}
  .modal{max-width:100%;border-radius:var(--radius-sm)}
  .modal-body{padding:12px 14px}
  .modal-header{padding:12px 14px}
  /* Shareholder rows */
  .sh-form-row{grid-template-columns:auto 1fr;gap:4px;padding:8px 6px}
  .sh-form-row input:nth-child(3),.sh-form-row input:nth-child(4){width:60px}
  /* Section headers */
  .section-header{flex-direction:column;align-items:flex-start}
  .section-title{font-size:16px}
  /* Toolbar */
  .toolbar{flex-direction:column;align-items:stretch}
  .search-wrap{min-width:unset}
  select.filter{width:100%}
  /* Investments kpi */
  div[style*="repeat(4,1fr)"]{grid-template-columns:1fr 1fr !important}
div[style*="repeat(5,1fr)"]{grid-template-columns:1fr 1fr !important}
div[style*="repeat(6,1fr)"]{grid-template-columns:1fr 1fr !important}
  /* Shareholder page */
  div[style*="grid-template-columns:1fr 1fr;gap:14px"]{grid-template-columns:1fr !important}
  /* Tabs */
  .tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .tab{white-space:nowrap;font-size:12px;padding:6px 10px}
  /* Buttons */
  .btn{padding:7px 12px;font-size:12px}
  .btn-sm{padding:5px 8px;font-size:11px}
  /* Drop zones */
  .drop-zone,.drop-upload{padding:14px}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">FamOfi <span>Registry</span></div>
    <div class="login-subtitle">Secure access — authorized users only</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="li-email" placeholder="your@email.com"
             onkeydown="if(event.key==='Enter')doLogin()" autocomplete="off">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="li-pass" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')doLogin()" autocomplete="off">
    </div>
    <button class="login-btn" id="li-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="li-err"></div>
    <div class="login-role-badge">🔒 Private system — FamOfi</div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:13px">Loading FamOfi…</div>
</div>

<div id="app">
  <header>
    <div class="logo">FamOfi <span>Registry</span></div>
    <nav id="nav"></nav>
    <div class="hdr-right">
      <div id="sync-dot" title="Sync"></div>
      <span id="user-badge" class="user-badge"></span>
      <button class="btn btn-outline btn-sm" id="import-btn" onclick="openImport()">⬆ Import</button>
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">ES</button>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </header>
  <main id="main"></main>
</div>


<script defer src="script.js"></script>

</body>
</html>
